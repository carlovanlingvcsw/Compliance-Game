<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ruimtestation Orion · Level 4: Het vrachtdok</title>
<link rel="stylesheet" href="../../assets/css/vcsw-brand.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="vcsw">
<div class="vcsw-brandbar"></div>
<div class="vcsw-container">
  <header class="vcsw-header compact">
    <span>
      <img class="vcsw-wordmark vcsw-wordmark-on-light" src="../../assets/img/vcsw-wordmark-on-light.png" alt="VCSW">
      <img class="vcsw-wordmark vcsw-wordmark-on-dark" src="../../assets/img/vcsw-wordmark-on-dark.png" alt="VCSW">
    </span>
    <span class="vcsw-header-meta">AVG-game Ruimtestation Orion<br>Level 4 van 5 plus eindmissie</span>
  </header>
</div>

<main class="vcsw-container game-main" id="main">
  <section class="hud" aria-label="Status">
    <div class="hud-item rank">
      <p class="hud-label"><svg class="vcsw-icon sm" viewBox="0 0 24 24" aria-hidden="true"><path d="m15.477 12.89 1.515 8.526a.5.5 0 0 1-.81.47l-3.58-2.687a1 1 0 0 0-1.197 0l-3.586 2.686a.5.5 0 0 1-.81-.469l1.514-8.526"/><circle cx="12" cy="8" r="6"/></svg>Rang</p>
      <p class="hud-value" id="hud-rank">Commandeur</p>
    </div>
    <div class="hud-item shield">
      <p class="hud-label"><svg class="vcsw-icon sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg>Schildsterkte</p>
      <p class="hud-value" id="hud-shield">100%</p>
      <div class="vcsw-progress-track" role="progressbar" aria-label="Schildsterkte" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100" id="hud-shield-bar"><div class="vcsw-progress-fill success" id="hud-shield-fill" style="width:100%"></div></div>
    </div>
    <div class="hud-item">
      <p class="hud-label"><svg class="vcsw-icon sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>Punten</p>
      <p class="hud-value" id="hud-score">0</p>
    </div>
    <div class="hud-item">
      <p class="hud-label"><svg class="vcsw-icon sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>Gratis hints</p>
      <p class="hud-value" id="hud-hints">3</p>
    </div>
    <div class="hud-item">
      <p class="hud-label"><svg class="vcsw-icon sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 3 8 9l4 13 4-13-2.5-6"/><path d="M17 3a2 2 0 0 1 1.6.8l3 4a2 2 0 0 1 .013 2.382l-7.99 10.986a2 2 0 0 1-3.247 0l-7.99-10.986A2 2 0 0 1 2.4 7.8l2.998-3.997A2 2 0 0 1 7 3z"/><path d="M2 9h20"/></svg>Datakristallen</p>
      <p class="hud-value" id="hud-crystals">0</p>
    </div>
  </section>

  <ol class="steps" id="steps" aria-label="Voortgang"></ol>

  <section class="vcsw-card stage" id="stage" aria-live="polite"></section>
  <p class="vcsw-sr-only" id="announce" aria-live="assertive"></p>
</main>

<div class="vcsw-container">
  <footer class="vcsw-footer">VCSW B.V. · Den Haag · vcsw.nl</footer>
</div>

<script src="game.js"></script>
</body>
</html>
