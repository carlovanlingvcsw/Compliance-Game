<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Orion level 5: Alarm in module Kepler</title>
<link rel="stylesheet" href="../../assets/css/vcsw-brand.css">
<link rel="stylesheet" href="../../assets/css/orion-theme.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="vcsw">
  <div class="game">
    <header class="vcsw-header">
      <span>
        <img class="vcsw-wordmark vcsw-wordmark-on-light" src="../../assets/img/vcsw-wordmark-on-light.png" alt="VCSW">
        <img class="vcsw-wordmark vcsw-wordmark-on-dark" src="../../assets/img/vcsw-wordmark-on-dark.png" alt="VCSW">
      </span>
      <span class="vcsw-header-meta">AVG-game Ruimtestation Orion<br>Prototype level 5</span>
    </header>

    <main class="vcsw-stack game-main">
      <!-- Smalle regel zolang het alarm loopt. Rood en rustig, zonder knipperen. -->
      <div class="alarmline" id="alarm" role="status" hidden></div>

      <!-- Eigen statusrij en stappenbalk. De schil toont deze gegevens zelf en verbergt .own-status. -->
      <section class="own-status ox-status" id="hud" aria-label="Status"></section>

      <section id="stage" aria-live="polite"></section>
      <div id="live" class="vcsw-sr-only" aria-live="polite"></div>
      <!-- Meetpunt: de brug meet de hoogte aan het laatste element zonder kinderen. Een knop met een pictogram telt daarbij niet mee. -->
      <div class="meet-einde" aria-hidden="true"></div>
    </main>

    <footer class="vcsw-footer">
      <span>VCSW B.V. · Den Haag · vcsw.nl</span>
      <span>Rang bij start: Kapitein</span>
    </footer>
  </div>
</div>

<script src="../../assets/js/orion-bridge.js"></script>
<script src="game.js"></script>
</body>
</html>
