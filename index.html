<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AVG-game Ruimtestation Orion</title>
<link rel="stylesheet" href="assets/css/vcsw-brand.css">
<link rel="stylesheet" href="assets/css/launcher.css">
</head>
<body class="vcsw">
<div class="shell">
  <header class="bar">
    <div class="bar-inner">
      <div class="brand">
        <span class="brand-title">AVG-game Ruimtestation Orion</span>
      </div>
      <nav aria-label="Levels" style="flex:1 1 300px;min-width:0"><ol class="levels" id="levels"></ol></nav>
      <div class="nav">
        <button class="vcsw-button outline sm" id="prev">Vorige</button>
        <button class="vcsw-button sm" id="next">Volgende</button>
      </div>
    </div>
  </header>
  <main class="stage" id="stage"></main>
</div>
<script src="assets/js/launcher.js"></script>
</body>
</html>
